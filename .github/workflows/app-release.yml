# Builds, signs, notarizes and publishes the desktop app when a tag like app-v0.1.0 is pushed.
# Secrets: APPLE_CERT_P12_BASE64 and APPLE_CERT_PASSWORD (the Developer ID Application
# certificate exported from Keychain Access), APPLE_ID, APPLE_APP_PASSWORD (an app-specific
# password) and APPLE_TEAM_ID. The zips land on a GitHub release, where update.electronjs.org
# serves them to installed copies.
name: Desktop app release

on:
  push:
    tags: ['app-v*']

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./app/package.json').version")
          [ "${GITHUB_REF_NAME}" = "app-v${version}" ] || { echo "Tag ${GITHUB_REF_NAME} is not app-v${version}"; exit 1; }
      - uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}
      - name: Package, sign and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node app/scripts/package.mjs --arch ${{ matrix.arch }} --notarize env
      - uses: actions/upload-artifact@v4
        with:
          name: Revelar-darwin-${{ matrix.arch }}
          path: app/dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
