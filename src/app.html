<!doctype html>
<html lang="%revelar.lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<script>
			(function () {
				try {
					var t = localStorage.getItem('revelar-theme');
					if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body>
		<!-- Every page is prerendered and light, and the photo viewer uses shallow routing, so
		     links are plain page loads: no __data.json files are needed (or shipped). -->
		<div style="display: contents" data-sveltekit-reload>%sveltekit.body%</div>
	</body>
</html>
